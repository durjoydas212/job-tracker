<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>settings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .Management {
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <!-- nev bar  -->

    <nav
      class="navbar navbar-light bg-white px-4 py-3 border-bottom position-fixed w-100 top-0 z-3"
    >
      <div class="d-flex align-items-center gap-2">
        <img
          src="https://allweatherseal.com/wp-content/uploads/2025/12/aws_logo_full_color_outline_no_tag.svg"
          style="height: 48px"
        />
      </div>

      <div class="ms-auto d-flex align-items-center gap-3">
        <button type="button" class="btn btn-outline-dark" onclick="goAdmin()">
          Dashboard
        </button>
        <div class="dropdown">
          <button
            class="btn btn-outline-dark rounded-circle d-flex align-items-center justify-content-center"
            type="button"
            id="profileBtn"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="width: 42px; height: 42px"
          >
            👤
          </button>

          <ul
            class="dropdown-menu dropdown-menu-end p-3"
            aria-labelledby="profileBtn"
            style="min-width: 220px"
          >
            <li class="fw-bold">Profile</li>
            <li class="text-muted small" id="profileAdminId"></li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="btn btn-sm btn-danger w-100" onclick="logout()">
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <h2 class="container pt-5 pb-5 Management">User Management</h2>

    <!-- ADD USER -->
    <div class="container">
      <div
        style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap"
      >
        <input id="name" placeholder="Name" />

        <input
          id="email"
          placeholder="Email"
          type="email"
          autocomplete="new-email"
        />

        <input id="phone" placeholder="Phone" />

        <input
          id="userPassword"
          placeholder="Password"
          type="password"
          autocomplete="new-password"
        />

        <select id="userRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <button onclick="addUser()">Add</button>
      </div>
    </div>

    <!-- USERS TABLE -->

    <div class="container">
      <h3 class="mt-5">Users</h3>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="userTable"></tbody>
      </table>
    </div>

    <div class="container">
      <h3 class="mt-4">Admins</h3>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="adminTable"></tbody>
      </table>
    </div>

    <hr />

    <!-- MY ACCOUNT -->
    <div class="my-account container">
      <h3>My Account</h3>
      <p id="myEmail"></p>
      <div class="pass d-flex gap-3 mb-3">
        <input
          id="oldPassword"
          class="form-control mb-2 w-25"
          placeholder="Old Password"
        />
        <input
          id="newPassword"
          class="form-control mb-2 w-25"
          placeholder="New Password"
        />
      </div>
      <button onclick="changeMyPassword()" class="btn btn-primary">
        Change Password
      </button>
    </div>

    <script>
      const API = "https://job-tracker-production-47e1.up.railway.app";

      const currentUser = JSON.parse(localStorage.getItem("user"));

      if (!currentUser || currentUser.role !== "admin") {
        alert("Access denied");
        window.location.href = "login.html";
      }

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("myEmail").innerText =
          currentUser.email || currentUser.phone || "-";
        document.getElementById("profileAdminId").innerText =
          currentUser.email ||
          currentUser.phone ||
          currentUser.name ||
          `Admin #${currentUser.id}`;
        loadUsers();
      });

      async function loadUsers() {
        const res = await fetch(`${API}/auth/users`, {
          headers: {
            "x-admin-id": currentUser.id,
          },
        });

        const users = await res.json();

        const userTable = document.getElementById("userTable");
        const adminTable = document.getElementById("adminTable");

        userTable.innerHTML = "";
        adminTable.innerHTML = "";

        users.forEach((user) => {
          if (user.role === "admin") {
            adminTable.innerHTML += `
                <tr>
                    <td>${user.name || "-"}</td>
                    <td>${user.email || "-"}</td>
                    <td>
                        ${
                          user.id == currentUser.id
                            ? "<span class='text-muted'>Current Admin</span>"
                            : `<button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button>`
                        }
                    </td>
                </tr>
            `;
          } else {
            userTable.innerHTML += `
                <tr>
                    <td>${user.name || "-"}</td>
                    <td>${user.phone || "-"}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                            onclick="deleteUser(${user.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
          }
        });
      }

      async function addUser() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("userPassword").value.trim();
        const role = document.getElementById("userRole").value;

        if ((!email && !phone) || !password) {
          alert("Please enter Email or Phone, and Password.");
          return;
        }

        const res = await fetch(`${API}/auth/add-user`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-id": currentUser.id,
          },
          body: JSON.stringify({
            name,
            email,
            phone,
            password,
            role,
          }),
        });
        document.getElementById("email").value = "";

        const data = await res.json();
        if (!res.ok) return alert(data.message || "Add user failed");

        alert("User added");
        loadUsers();
        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("userPassword").value = "";
      }

      async function deleteUser(id) {
        if (!confirm("Delete this user?")) return;

        const res = await fetch(`${API}/auth/user/${id}`, {
          method: "DELETE",
          headers: {
            "x-admin-id": currentUser.id,
          },
        });

        const data = await res.json();

        if (!res.ok) {
          return alert(data.message);
        }

        alert("User deleted successfully");
        loadUsers();
      }

      async function changeMyPassword() {
        const oldPassword = document.getElementById("oldPassword").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();

        if (!oldPassword || !newPassword) {
          alert("Enter old password and new password");
          return;
        }

        const res = await fetch(
          `${API}/auth/change-password/${currentUser.id}`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "x-user-id": currentUser.id,
            },
            body: JSON.stringify({ oldPassword, newPassword }),
          },
        );

        const data = await res.json();
        if (!res.ok) return alert(data.message || "Error updating password");

        alert("Password updated successfully");
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }

      function goAdmin() {
        window.location.href = "admin.html";
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
