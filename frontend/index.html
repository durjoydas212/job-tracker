  <body class="bg-light">
    <!-- nav  -->

    <nav

    >
      <div class="d-flex align-items-center gap-2">
        <img
          src="https://allweatherseal.com/wp-content/uploads/2025/12/aws_logo_full_color_outline_no_tag.svg"

      </div>

      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="dropdown">
          <ul

        <div class="dropdown">

            aria-expanded="false"
            style="width: 42px; height: 42px"

            👤
          </button>

          <ul
            class="dropdown-menu dropdown-menu-end p-3"
            aria-labelledby="profileBtn"
            style="min-width: 220px"
          >
            <li class="fw-bold">Profile</li>
            <li class="text-muted small" id="profileUserId">User</li>
            <li><hr class="dropdown-divider" /></li>

    </nav>

    <div class="container mt-5 pt-3">
      <div class="d-flex align-items-center gap-2 mb-3 mt-5">
        <input
          type="text"

        <div class="dropdown">
          <button
            class="btn btn-outline-secondary shadow-sm"

            style="width: 50px; height: 50px"

            <i class="bi bi-funnel"></i>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="#" onclick="filterStatus('')">
                All
              </a>
            </li>

            <li><hr class="dropdown-divider" /></li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('Pending')"
                >Pending</a
              >
            </li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('Approved')"
                >Approved</a
              >
            </li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('Declined')"
                >Declined</a
              >

            <li>
              <a

                href="#"
                onclick="filterStatus('Started')"

              >
            </li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('Incomplete')"
                >Incomplete</a

            </li>

              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('Complete')"
                >Complete</a
              >
            </li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('CallBack')"
                >Call Back</a
              >
            </li>

            <li>
              <a
                class="dropdown-item"
                href="#"
                onclick="filterStatus('ChangeOrder')"
                >Change Order</a
              >
            </li>
          </ul>
        </div>
      </div>
      <hr />

      <h5 class="fw-bold mt-3">My Jobs :</h5>

      <div id="myJobs" class="mt-2 mb-5"></div>

      <hr />

      <h5 class="fw-bold mt-4">Job History :</h5>

      <div id="history" class="mt-2"></div>
      <div id="userInfo"></div>
    </div>

    <script>
      const currentUser = JSON.parse(localStorage.getItem("user") || "null");
      let openedDetails = {};
      if (!currentUser || !currentUser.role) {
        localStorage.removeItem("user");
        window.location.replace("login.html");
      }
      let lastStatuses = {};
      let lastData = "";
      let soundEnabled = false;

      const API = "https://app-job-tracker.up.railway.app";

      document.addEventListener("submit", function (e) {
        e.preventDefault();
      });

      document.addEventListener("click", () => {
        soundEnabled = true;
      });
      document.body.style.scrollBehavior = "smooth";

      // ================= STATUS HANDLER =================
      function handleStatus() {
        const status = document.getElementById("status").value;

        document.getElementById("startedSection").style.display =
          status === "Started" ? "block" : "none";

        document.getElementById("incompleteSection").style.display =
          status === "Incomplete" ? "block" : "none";

        document.getElementById("completeSection").style.display =
          status === "Complete" ? "block" : "none";
      }

      function handleWalkthrough() {
        const value = document.getElementById("walkthrough").value;

        document.getElementById("startedDetails").style.display =
          value === "yes" || value === "no" ? "block" : "none";
      }
      let currentFilter = "";

      function filterStatus(status) {
        currentFilter = status;
        loadHistory();
      }

      // ================= IMAGE UPLOAD =================
      async function uploadImage(file) {
        const formData = new FormData();
        formData.append("image", file);

        const res = await fetch(`${API}/jobs/upload`, {
          method: "POST",
          body: formData,
        });

        if (!res.ok) {
          alert("Image upload failed");
          return "";
        }

        const data = await res.json();

        return data.filePath;
      }
      async function uploadImages(files) {
        const uploaded = [];

        for (let file of files) {
          const formData = new FormData();
          formData.append("image", file);

          const res = await fetch(`${API}/jobs/upload`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            alert("Image upload failed");
            continue;
          }

          const data = await res.json();
          uploaded.push(data.filePath);
        }

        return uploaded;
      }
      // id

      if (!currentUser) {
        window.location.href = "login.html";
      }

      document.getElementById("profileUserId").innerHTML = `
    <div style="font-weight:600;">
        ${currentUser.name || "User"}
    </div>
    <div style="font-size:13px;color:#777;">
        ${currentUser.email || currentUser.phone || ""}
    </div>
`;

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }

      // ================= SAVE JOB =================
      async function saveJob() {
        try {
          const job_number = document.getElementById("jobNumber").value;
          const status = document.getElementById("status").value;

          if (!job_number || !status) {
            alert("Fill job number and status");
            return;
          }

          const res = await fetch(`${API}/jobs/${job_number}`);
          const existingJobs = await res.json();

          // prevent duplicate status
          const alreadyExists = existingJobs.find((j) => j.status === status);

          if (alreadyExists) {
            alert("This status already exists for this job!");
            return;
          }

          let data = {};
          let notes = "";

          // STARTED
          if (status === "Started") {
            const beforeFiles = document.getElementById(
              "startedBeforeImages",
            ).files;

            const afterFiles =
              document.getElementById("startedAfterImages").files;

            const issueFiles =
              document.getElementById("startedIssueImages").files;

            const beforeImages = beforeFiles.length
              ? await uploadImages(beforeFiles)
              : [];

            const afterImages = afterFiles.length
              ? await uploadImages(afterFiles)
              : [];

            const issueImages = issueFiles.length
              ? await uploadImages(issueFiles)
              : [];

            const uploadToDrive = document.getElementById(
              "startedUploadToDrive",
            ).checked;

            notes = document.getElementById("notes").value;

            data = {
              userPhone: currentUser.phone,
              userId: currentUser.id,

              walkthrough: document.getElementById("walkthrough").value,
              tag1: document.getElementById("tag1").value,
              tag2: document.getElementById("tag2").value,

              beforeImages,
              afterImages,
              issueImages,

              uploadToDrive,
            };
          }

          // INCOMPLETE
          if (status === "Incomplete") {
            const beforeFiles =
              document.getElementById("incBeforeImages").files;

            const afterFiles = document.getElementById("incAfterImages").files;

            const issueFiles = document.getElementById("incIssueImages").files;

            const beforeImages = beforeFiles.length
              ? await uploadImages(beforeFiles)
              : [];

            const afterImages = afterFiles.length
              ? await uploadImages(afterFiles)
              : [];

            const issueImages = issueFiles.length
              ? await uploadImages(issueFiles)
              : [];

            const uploadToDrive =
              document.getElementById("incUploadToDrive").checked;

            notes = document.getElementById("incNotes").value;

            data = {
              userPhone: currentUser.phone,
              userId: currentUser.id,

              time: document.getElementById("timeNeeded").value,
              installers: document.getElementById("installers").value,
              material: document.getElementById("material").value,

              beforeImages,
              afterImages,
              issueImages,

              uploadToDrive,
            };
          }

          // COMPLETE
          if (status === "Complete") {
            const beforeFiles = document.getElementById("beforeImages").files;
            const afterFiles = document.getElementById("afterImages").files;
            const issueFiles = document.getElementById("issueImages").files;

            const beforeImages = beforeFiles.length
              ? await uploadImages(beforeFiles)
              : [];

            const afterImages = afterFiles.length
              ? await uploadImages(afterFiles)
              : [];

            const issueImages = issueFiles.length
              ? await uploadImages(issueFiles)
              : [];

            const uploadToDrive =
              document.getElementById("uploadToDrive").checked;

            notes = document.getElementById("completeNotes").value;

            data = {
              userPhone: currentUser.phone,
              userId: currentUser.id,

              cos: document.getElementById("cos").value,
              payment: document.getElementById("payment").value,
              finance: document.getElementById("finance").value,
              referral: document.getElementById("referral").value,
              installers: document.getElementById("installersComplete").value,

              beforeImages,
              afterImages,
              issueImages,

              uploadToDrive,
            };
          }

          const response = await fetch(`${API}/jobs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_number, status, notes, data }),
          });

          const result = await response.json();

          alert("Saved successfully!");

          document.getElementById("jobNumber").value = "";

          setTimeout(() => {
            loadHistory();
          }, 5000);

          // reset other fields
          document.getElementById("status").value = "";

          document.getElementById("notes").value = "";
          document.getElementById("incNotes").value = "";
          document.getElementById("completeNotes").value = "";

          const imageFile = document.getElementById("imageFile");
          if (imageFile) imageFile.value = "";

          const imageTags = document.getElementById("imageTags");
          if (imageTags) imageTags.value = "";
          document.getElementById("beforeImages").value = "";
          document.getElementById("afterImages").value = "";
          document.getElementById("issueImages").value = "";

          handleStatus();
        } catch (err) {
          console.error(err);
          alert("Error saving job");
        }
      }
      // job images render
      function renderJobImages(images = []) {
        const imgs = Array.isArray(images) ? images : [];
        const getPath = (img) => (typeof img === "string" ? img : img.path);
        if (!imgs.length) return "";

        const total = imgs.length;

        if (total === 1) {
          return `
      <img src="https://app-job-tracker.up.railway.app${getPath(imgs[0])}"
           onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, 0)'
           style="width:100%; max-width:280px; border-radius:10px; margin-top:5px; cursor:pointer; display:block;">
    `;
        }

        if (total === 2) {
          return `
      <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; max-width:280px; margin-top:5px;">
        ${imgs
          .map(
            (img, i) => `
          <img src="https://app-job-tracker.up.railway.app${getPath(img)}"
               onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, ${i})'
               style="width:100%; height:140px; object-fit:cover; border-radius:8px; cursor:pointer;">
        `,
          )
          .join("")}
      </div>
    `;
        }

        if (total === 3) {
          return `
      <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:6px; max-width:280px; margin-top:5px;">
        <img src="https://app-job-tracker.up.railway.app${getPath(imgs[0])}"
             onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, 0)'
             style="grid-row:span 2; width:100%; height:244px; object-fit:cover; border-radius:8px; cursor:pointer;">
        <img src="https://app-job-tracker.up.railway.app${getPath(imgs[1])}"
             onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, 1)'
             style="width:100%; height:118px; object-fit:cover; border-radius:8px; cursor:pointer;">
        <img src="https://app-job-tracker.up.railway.app${getPath(imgs[2])}"
             onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, 2)'
             style="width:100%; height:118px; object-fit:cover; border-radius:8px; cursor:pointer;">
      </div>
    `;
        }

        const shown = imgs.slice(0, 4);

        return `
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; max-width:280px; margin-top:5px;">
      ${shown
        .map((img, i) => {
          const isLast = i === 3 && total > 4;
          return `
          <div style="position:relative;">
            <img src="https://app-job-tracker.up.railway.app${getPath(img)}"
                 onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, ${i})'
                 style="width:100%; height:120px; object-fit:cover; border-radius:8px; cursor:pointer;">
            ${
              isLast
                ? `<div onclick='openImageViewerFromDB(${JSON.stringify(imgs)}, ${i})'
                 style="position:absolute; inset:0; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; border-radius:8px; cursor:pointer;">+${total - 4}</div>`
                : ""
            }
          </div>
        `;
        })
        .join("")}
    </div>
  `;
      }

      // PHOTO UPLODE SECTION

      function renderPhotoSection(job) {
        const d = job.data || {};
        const jobLocked = d.locked || d.closed;
        const adminStatus = d.adminStatus || job.status || "Pending";

        const canUpload = !jobLocked && !["Complete"].includes(job.status);

        return `
  
<h6 class="mt-3 fw-bold">Before Photos</h6>

${renderJobImages(d.beforeImages || [])}

${
  !jobLocked
    ? `
<div class="mt-2 d-flex gap-2 align-items-center">

<input
type="file"
id="before-${job.id}"
multiple
hidden
onchange="previewBeforeImages(${job.id})">

<label
for="before-${job.id}"
class="btn btn-outline-primary btn-sm"
id="beforeAddBtn-${job.id}">
<i class="fa-solid fa-image"></i> Add Images
</label>

<button
class="btn btn-success btn-sm d-none"
id="beforeSendBtn-${job.id}"
onclick="uploadJobPhotos(${job.id},'before')">
<i class="fa-solid fa-paper-plane"></i> Send
</button>

</div>

<div
id="beforePreview-${job.id}"
class="d-flex flex-wrap gap-2 mt-2">
</div>
`
    : ""
}

<h6 class="mt-3 fw-bold">After Photos</h6>

${renderJobImages(d.afterImages || [])}

${
  !jobLocked
    ? `
<div class="mt-2 d-flex gap-2 align-items-center">

<input
type="file"
id="after-${job.id}"
multiple
hidden
onchange="previewAfterImages(${job.id})">

<label
for="after-${job.id}"
class="btn btn-outline-primary btn-sm"
id="afterAddBtn-${job.id}">
<i class="fa-solid fa-image"></i> Add Images
</label>

<button
class="btn btn-success btn-sm d-none"
id="afterSendBtn-${job.id}"
onclick="uploadJobPhotos(${job.id},'after')">
<i class="fa-solid fa-paper-plane"></i> Send
</button>

</div>

<div
id="afterPreview-${job.id}"
class="d-flex flex-wrap gap-2 mt-2">
</div>
`
    : ""
}

<h6 class="mt-3 fw-bold">Issue Photos</h6>

${renderJobImages(d.issueImages || [])}

${
  !jobLocked
    ? `
<div class="mt-2 d-flex gap-2 align-items-center">

<input
type="file"
id="issue-${job.id}"
multiple
hidden
onchange="previewIssueImages(${job.id})">

<label
for="issue-${job.id}"
class="btn btn-outline-primary btn-sm"
id="issueAddBtn-${job.id}">
<i class="fa-solid fa-image"></i> Add Images
</label>

<button
class="btn btn-success btn-sm d-none"
id="issueSendBtn-${job.id}"
onclick="uploadJobPhotos(${job.id},'issue')">
<i class="fa-solid fa-paper-plane"></i> Send
</button>

</div>

<div
id="issuePreview-${job.id}"
class="d-flex flex-wrap gap-2 mt-2">
</div>
`
    : ""
}
`;
      }

      async function uploadJobPhotos(jobId, type) {
        const input = document.getElementById(`${type}-${jobId}`);

        if (!input.files.length) return;

        try {
          // Upload images
          const uploadedImages = await uploadImages(input.files);

          // Save to job
          const res = await fetch(`${API}/jobs/${jobId}/photos`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              type,
              images: uploadedImages,
              user: currentUser.name,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.message || "Upload failed");
            return;
          }

          // Clear input
          input.value = "";

          if (type === "before") {
            document.getElementById(`beforePreview-${jobId}`).innerHTML = "";
            document
              .getElementById(`beforeSendBtn-${jobId}`)
              .classList.add("d-none");
          }

          if (type === "after") {
            document.getElementById(`afterPreview-${jobId}`).innerHTML = "";
            document
              .getElementById(`afterSendBtn-${jobId}`)
              .classList.add("d-none");
          }

          if (type === "issue") {
            document.getElementById(`issuePreview-${jobId}`).innerHTML = "";
            document
              .getElementById(`issueSendBtn-${jobId}`)
              .classList.add("d-none");
          }

          loadHistory();

          // Reload jobs
          loadHistory();
        } catch (err) {
          console.error(err);
          alert("Upload failed");
        }
      }

      // ================= LOAD HISTORY =================
      let draftReplies = {};
      async function loadHistory() {
        let url = `${API}/jobs`;

        const res = await fetch(url);
        const jobs = await res.json();

        let filteredJobs = jobs.filter((job) => {
          const assigned = job.data?.assignedUsers || [];

          return assigned.some(
            (user) => String(user.id) === String(currentUser.id),
          );
        });

        // sort latest first
        filteredJobs.sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at),
        );

        const myJobsContainer = document.getElementById("myJobs");
        const historyContainer = document.getElementById("history");

        myJobsContainer.innerHTML = "";
        historyContainer.innerHTML = "";
        document.querySelectorAll('textarea[id^="reply-"]').forEach((t) => {
          draftReplies[t.id] = t.value;
        });

        // ================= FILTER =================
        if (currentFilter) {
          filteredJobs = filteredJobs.filter(
            (job) => job.status === currentFilter,
          );
        }
        // ================= SEARCH =================
        const search = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();

        if (search) {
          filteredJobs = filteredJobs.filter((job) => {
            const d = job.data || {};

            return (
              (job.job_number || "")
                .toString()
                .toLowerCase()
                .includes(search) ||
              (d.customerName || "").toLowerCase().includes(search) ||
              (d.customerPhone || "")
                .toString()
                .toLowerCase()
                .includes(search) ||
              (d.customerAddress || "").toLowerCase().includes(search)
            );
          });
        }
        // show ALL history
        filteredJobs.forEach((job, index) => {
          const d = job.data || {};

          const jobLocked = d.locked || d.closed;
          const adminStatus = d.adminStatus || job.status || "Pending";
          let tags = [];

          if (d.tags) {
            tags = Array.isArray(d.tags) ? d.tags : d.tags.split(",");
          }

          const jobId = job.job_number;
          const currentStatus = job.status;

          // notification only for latest item
          if (
            lastStatuses[jobId] !== undefined &&
            lastStatuses[jobId] !== currentStatus &&
            index === 0
          ) {
            if (currentStatus === "Approved") {
              showNotification(`Job #${job.job_number} Approved`, "approved");
            }

            if (currentStatus === "Declined") {
              showNotification(`Job #${job.job_number} Declined`, "declined");
            }

            if (currentStatus === "Rework") {
              showNotification(`Job #${job.job_number} Needs Rework`, "rework");
            }
          }

          lastStatuses[jobId] = currentStatus;

          const date = new Date(job.created_at).toLocaleString("en-US", {
            dateStyle: "medium",
            timeStyle: "short",
          });

          const statusColor =
            job.status === "Approved"
              ? "green"
              : job.status === "Incomplete" && index === 0
                ? "orange"
                : "gray";

          const div = document.createElement("div");
          div.className = "card p-3 mb-3 border-2";
          div.style.borderColor = statusColor;

          div.innerHTML = `
    <strong>Job #:</strong> ${job.job_number} <br>
    <div class="d-flex justify-content-between align-items-center mb-3">

    <div>

        <label class="fw-bold d-block">Status</label>

        <span
            id="statusBadge-${job.id}"
            class="badge bg-primary fs-6 px-3 py-2"
        >
            ${d.requestedStatus || job.status}
        </span>

    </div>

    <button
class="btn btn-outline-primary btn-sm"
onclick="showStatusEditor(${job.id})"
${jobLocked || d.requestedStatus ? "disabled" : ""}>
${d.requestedStatus ? "Pending" : '<i class="bi bi-pencil"></i> Change'}
</button>

</div>

<div
    id="statusEditor-${job.id}"
    style="display:none"
>

<select
    id="statusSelect-${job.id}"
    class="form-select mb-2"
>

<option value="Started">Started</option>
<option value="Incomplete">Incomplete</option>
<option value="Complete">Complete</option>
<option value="Call Back">Call Back</option>
<option value="Change Order">Change Order</option>

</select>

<div class="text-end">

<button
class="btn btn-secondary btn-sm"
onclick="hideStatusEditor(${job.id})">
Cancel
</button>

      function showStatusEditor(jobId) {

      async function saveUserStatus(jobId) {
        const status = document.getElementById(`statusSelect-${jobId}`).value;

        // Update job
        const res = await fetch(`${API}/jobs/${jobId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            requestedStatus: status,
            adminStatus: "Pending",
          }),
        });

        if (!res.ok) {
          alert("Failed to update status");
          return;
        }

        // Send notification to admin chat
        await fetch(`${API}/jobs/message/${jobId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            sender: currentUser.name,
            text: `requested status change to "${status}".`,
          }),
        });

        hideStatusEditor(jobId);

        loadHistory();
      }

      function toggleDetails(jobId) {
        const details = document.getElementById(`details-${jobId}`);
        const arrow = document.getElementById(`arrow-${jobId}`);

        if (details.style.display === "none") {
          details.style.display = "block";

          arrow.classList.remove("fa-chevron-down");
          arrow.classList.add("fa-chevron-up");

          openedDetails[jobId] = true;
        } else {
          details.style.display = "none";

          arrow.classList.remove("fa-chevron-up");
          arrow.classList.add("fa-chevron-down");

          delete openedDetails[jobId];
        }
      }
      function showStatusEditor(jobId) {
        document.getElementById(`statusEditor-${jobId}`).style.display =
          "block";
      }

      function hideStatusEditor(jobId) {
        document.getElementById(`statusEditor-${jobId}`).style.display = "none";
      }
      function renderImages(images = []) {
        if (!images.length) return "";

        const total = images.length;
        const show = images.slice(0, 4);

        // 1 image
        if (total === 1) {
          return `
      <img 
        src="https://app-job-tracker.up.railway.app${images[0]}"
        onclick='openImageViewerFromDB(${JSON.stringify(images)}, 0)'
        style="
          width:100%;
          max-width:280px;
          border-radius:10px;
          margin-top:5px;
          cursor:pointer;
        ">
    `;
        }

        // multiple images
        return `
    <div style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:4px;
      max-width:280px;
      margin-top:5px;
    ">
      ${show
        .map((img, i) => {
          const isLast = i === 3 && total > 4;

          return `
            <div style="position:relative;">
              
              <img 
                src="https://app-job-tracker.up.railway.app${getPath(img)}"
                onclick='openImageViewerFromDB(${JSON.stringify(images)}, ${i})'
                style="
                  width:100%;
                  height:120px;
                  object-fit:cover;
                  border-radius:8px;
                  cursor:pointer;
                "
              >

              ${
                isLast
                  ? `
                <div 
                  onclick='openImageViewerFromDB(${JSON.stringify(images)}, ${i})'
                  style="
                    position:absolute;
                    top:0;
                    left:0;
                    width:100%;
                    height:100%;
                    background:rgba(0,0,0,0.6);
                    color:white;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:20px;
                    font-weight:bold;
                    border-radius:8px;
                    cursor:pointer;
                  "
                >
                  +${total - 4}
                </div>
              `
                  : ""
              }

            </div>
          `;
        })
        .join("")}
    </div>
  `;
      }

      // open image viewer from DB
      window.openImageViewerFromDB = function (images, startIndex = 0) {
        let current = startIndex;

        const overlay = document.createElement("div");

        overlay.style = `
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
  `;

        const img = document.createElement("img");

        img.style = `
    max-width:90%;
    max-height:90%;
    object-fit:contain;
    border-radius:8px;
  `;

        function show(index) {
          current = index;
          img.src = API + images[current];
        }

        show(current);

        // PREV
        const prev = document.createElement("div");
        prev.innerHTML = "◀";
        prev.style = `
    position:absolute;
    left:20px;
    font-size:40px;
    color:white;
    cursor:pointer;
  `;
        prev.onclick = () => {
          if (current > 0) show(current - 1);
        };

        // NEXT
        const next = document.createElement("div");
        next.innerHTML = "▶";
        next.style = `
    position:absolute;
    right:20px;
    font-size:40px;
    color:white;
    cursor:pointer;
  `;
        next.onclick = () => {
          if (current < images.length - 1) show(current + 1);
        };

        // CLOSE
        const close = document.createElement("div");
        close.innerHTML = "✖";
        close.style = `
    position:absolute;
    top:20px;
    right:20px;
    font-size:30px;
    color:white;
    cursor:pointer;
  `;
        close.onclick = () => overlay.remove();

        overlay.appendChild(img);
        overlay.appendChild(prev);
        overlay.appendChild(next);
        overlay.appendChild(close);

        document.body.appendChild(overlay);
      };

      window.handleEnter = function (event, jobId) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          event.stopPropagation();
          sendMessage(jobId);
          return false;
        }
      };
      window.uploadMessageImagesToDrive = async function (jobId, btn) {
        const res = await fetch(`${API}/jobs/upload-message-drive/${jobId}`, {
          method: "POST",
        });

        const data = await res.json();

        if (data.success) {
          btn.innerHTML =
            '<i class="fa-solid fa-circle-check text-success"></i>';

          btn.disabled = true;
        }
      };

      // send reply

      window.sendMessage = async function (jobId) {
        const textInput = document.getElementById(`reply-${jobId}`);
        const fileInput = document.getElementById(`img-${jobId}`);

        const text = textInput.value.trim();
        const files = fileInput.files;

        if (!text && !files.length) {
          return false;
        }

        let imagePaths = [];

        try {
          // upload images
          if (files.length) {
            for (let i = 0; i < files.length; i++) {
              const formData = new FormData();
              formData.append("image", files[i]);

              const uploadRes = await fetch(`${API}/jobs/upload`, {
                method: "POST",
                body: formData,
              });

              const uploadData = await uploadRes.json();

              imagePaths.push(uploadData.filePath);
            }
          }

          // send message
          const res = await fetch(`${API}/jobs`);
          const jobs = await res.json();

          const job = jobs.find((j) => j.id == jobId);

          if (job?.data?.locked || job?.data?.closed) {
            alert("This job has been locked by the administrator.");
            return;
          }
          await fetch(
            `https://app-job-tracker.up.railway.app/jobs/message/${jobId}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                text,
                images: imagePaths,
                sender: "user",
                senderName: currentUser.name,
                uploadToDrive: true,
              }),
            },
          );

          // clear fields
          textInput.value = "";
          fileInput.value = "";

          const preview = document.getElementById(`preview-container-${jobId}`);

          if (preview) {
            preview.innerHTML = "";
          }

          const chatBox = textInput
            .closest(".card")
            .querySelector("[data-chat-box]");

          const messageDiv = document.createElement("div");

          messageDiv.style.display = "flex";
          messageDiv.style.justifyContent = "flex-start";
          messageDiv.style.margin = "6px 0";

          messageDiv.innerHTML = `
<div
style="
background:#dcf8c6;
padding:10px;
border-radius:12px;
max-width:70%;
">

<div
style="
font-size:12px;
font-weight:bold;
color:#0d6efd;
margin-bottom:4px;
">
${currentUser.name}
</div>

${text ? `<div style="margin-bottom:5px;">${text}</div>` : ""}

${imagePaths.length ? renderImages(imagePaths) : ""}

<div
style="
font-size:11px;
color:#666;
text-align:right;
margin-top:5px;
">
${new Date().toLocaleTimeString()}
</div>

</div>
`;

          chatBox.appendChild(messageDiv);

          chatBox.scrollTop = chatBox.scrollHeight;

          // append message without rebuilding page

          chatBox.scrollTop = chatBox.scrollHeight;

          return false;
        } catch (err) {
          console.error(err);
          alert("Send failed");

          return false;
        }
      };

      // preview images before sending

      window.previewImages = function (jobId) {
        const files = document.getElementById(`img-${jobId}`).files;
        const container = document.getElementById(`preview-container-${jobId}`);
        container.innerHTML = "";

        if (!files.length) return;

        const maxShow = 3;

        for (let i = 0; i < Math.min(files.length, maxShow); i++) {
          const wrapper = document.createElement("div");
          wrapper.style.position = "relative";
          wrapper.style.width = "60px";
          wrapper.style.height = "60px";

          const img = document.createElement("img");
          img.src = URL.createObjectURL(files[i]);
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.objectFit = "cover";
          img.style.borderRadius = "6px";
          wrapper.appendChild(img);

          // overlay ONLY on last visible (3rd)
          if (i === maxShow - 1 && files.length > maxShow) {
            const overlay = document.createElement("div");
            overlay.innerText = `+${files.length - maxShow}`;
            overlay.style.position = "absolute";
            overlay.style.top = "0";
            overlay.style.left = "0";
            overlay.style.width = "100%";
            overlay.style.height = "100%";
            overlay.style.display = "flex";
            overlay.style.alignItems = "center";
            overlay.style.justifyContent = "center";
            overlay.style.background = "rgba(0,0,0,0.6)";
            overlay.style.color = "#fff";
            overlay.style.fontWeight = "bold";
            overlay.style.borderRadius = "6px";
            overlay.style.cursor = "pointer";

            overlay.onclick = () => openImagePreview(jobId, 2);

            wrapper.appendChild(overlay);
          }
          img.onclick = () => openImagePreview(jobId, i);

          container.appendChild(wrapper);
        }
      };

      window.openImagePreview = function (jobId, startIndex = 0) {
        const files = document.getElementById(`img-${jobId}`).files;

        let current = startIndex;

        const overlay = document.createElement("div");
        overlay.style = `
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
  `;

        const img = document.createElement("img");
        img.style = `
    max-width:90%;
    max-height:90%;
    object-fit:contain;
    border-radius:8px;
  `;

        function showImage(index) {
          current = index;
          img.src = URL.createObjectURL(files[current]);
        }

        showImage(current);

        // LEFT BUTTON
        const prev = document.createElement("div");
        prev.innerHTML = "◀";
        prev.style = `
    position:absolute;
    left:20px;
    font-size:40px;
    color:white;
    cursor:pointer;
  `;
        prev.onclick = () => {
          if (current > 0) showImage(current - 1);
        };

        // RIGHT BUTTON
        const next = document.createElement("div");
        next.innerHTML = "▶";
        next.style = `
    position:absolute;
    right:20px;
    font-size:40px;
    color:white;
    cursor:pointer;
  `;
        next.onclick = () => {
          if (current < files.length - 1) showImage(current + 1);
        };

        // CLOSE
        const close = document.createElement("div");
        close.innerHTML = "✖";
        close.style = `
    position:absolute;
    top:20px;
    right:20px;
    font-size:20px;
    color:red;
    cursor:pointer;
  `;
        close.onclick = () => overlay.remove();

        overlay.appendChild(img);
        overlay.appendChild(prev);
        overlay.appendChild(next);
        overlay.appendChild(close);

        document.body.appendChild(overlay);
      };
      // notification

      function showNotification(message, type = "info") {
        const old = document.getElementById("job-notification");
        if (old) old.remove();

        const div = document.createElement("div");
        div.id = "job-notification";

        div.innerHTML = message;

        div.style.position = "fixed";
        div.style.top = "20px";
        div.style.right = "20px";
        div.style.padding = "12px 20px";
        div.style.borderRadius = "8px";
        div.style.color = "#fff";
        div.style.fontWeight = "bold";
        div.style.zIndex = "9999";
        div.style.boxShadow = "0 4px 12px rgba(0,0,0,.2)";

        if (type === "approved") {
          div.style.background = "#28a745";
          div.innerHTML = "✅ " + message;
        } else if (type === "declined") {
          div.style.background = "#dc3545";
          div.innerHTML = "❌ " + message;
        } else if (type === "rework") {
          div.style.background = "#ffc107";
          div.style.color = "#000";
          div.innerHTML = "⚠️ " + message;
        } else {
          div.style.background = "#333";
        }

        document.body.appendChild(div);

        if (soundEnabled) {
          try {
            const audio = new Audio(
              "https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3",
            );

            audio.volume = 1;
            audio.play().catch((err) => {
              console.log("Sound blocked:", err);
            });
          } catch (err) {
            console.log(err);
          }
        }

        setTimeout(() => {
          div.style.opacity = "0";

          setTimeout(() => {
            div.remove();
          }, 500);
        }, 5000);
      }

      let isTyping = false;
      let userReadingOldMessages = false;

      document.addEventListener("focusin", (e) => {
        if (e.target.id && e.target.id.startsWith("reply-")) {
          isTyping = true;
        }
      });

      document.addEventListener("focusout", (e) => {
        if (e.target.id && e.target.id.startsWith("reply-")) {
          setTimeout(() => {
            isTyping = false;
          }, 1000);
        }
      });

      async function checkForUpdates() {
        try {
          const res = await fetch(`${API}/jobs?t=${Date.now()}`, {
            cache: "no-store",
          });

          const jobs = await res.json();

          const hash = JSON.stringify(jobs);

          if (hash !== lastData) {
            console.log("UPDATE FOUND");

            lastData = hash;

            await loadHistory();
          }
        } catch (err) {
          console.error("AUTO REFRESH ERROR:", err);
        }
      }
      window.uploadJobToDrive = async function (jobId) {
        try {
          const btn = event.target;
          btn.disabled = true;
          btn.innerText = "Uploading...";

          const res = await fetch(`${API}/jobs/upload-drive/${jobId}`, {
            method: "POST",
          });

          const data = await res.json();

          if (data.success) {
            await loadHistory();
          } else {
            btn.disabled = false;
            btn.innerText = "Upload To Drive";
            alert("Drive upload failed");
          }
        } catch (err) {
          console.error(err);
          alert("Drive upload failed");
        }
      };

      loadHistory();

      setInterval(async () => {
        if (isTyping) return;

        const fileInputs = document.querySelectorAll(
          'input[type="file"][id^="img-"]',
        );

        for (const input of fileInputs) {
          if (input.files && input.files.length > 0) {
            return;
          }
        }

        const oldScrollY = window.scrollY;

        await checkForUpdates();

        window.scrollTo(0, oldScrollY);
      }, 3000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
